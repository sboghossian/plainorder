name = "plainorder"
main = "src/index.ts"
compatibility_date = "2026-05-09"
compatibility_flags = ["nodejs_compat"]

# Static assets are served by Cloudflare Pages from ../public; the Worker
# only handles /api/*. When we wire this up to Pages we'll add the
# routing rule there. For local dev (wrangler dev), the static page is
# served by a simple sibling python -m http.server on :8787 and the
# Worker proxies to it via its assets binding. See README for details.

[assets]
directory = "../public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "RATELIMIT"
id = "fc126a9d38b54cd4bba925740f767b46"

# Custom domain. Requires the dashable.dev zone to be in this Cloudflare
# account. If deploy fails on this line, comment it out, ship to the
# workers.dev URL, then add the route in the Cloudflare dashboard.
[[routes]]
pattern = "plainorder.dashable.dev"
custom_domain = true

# Secrets — set with:
#   wrangler secret put OPENROUTER_API_KEY
# Do NOT commit the key.
